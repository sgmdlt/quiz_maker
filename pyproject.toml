[project]
name = "quiz-maker"
version = "2.0.0"
description = "Конструктор видео-квизов «Угадай песню»"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.2",
    "numpy>=1.26",
    # yt-dlp с компонентом EJS: нужен для YouTube вместе с JavaScript-движком
    "yt-dlp[default]>=2025.11.12",
    # JavaScript-движок для yt-dlp; ставится из PyPI, отдельная установка не нужна
    "deno>=2.0",
    "piper-tts>=1.8.0",
    "edge-tts>=7.3.1",
]

[tool.uv]
# Скрипты лежат в корне папки и запускаются через «uv run make_quiz.py …»,
# собирать проект в пакет не нужно.
package = false

[dependency-groups]
dev = [
    "deptry==0.25.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120  # как в коде проекта

[tool.ruff.lint]
# намеренно: широкие except там, где сбой внешнего инструмента не должен ронять работу; check=False — это и так значение по умолчанию
ignore = ["BLE001", "S110", "S112", "PLW1510"]

[tool.deptry.per_rule_ignores]
# deno — JavaScript-движок для yt-dlp: им пользуется yt-dlp как программой, импорта в коде нет
DEP002 = ["deno"]
