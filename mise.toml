# Инструменты проекта и проверки. Одни и те же версии у разработчика и в CI.
# Python-зависимости (ruff, pytest…) живут в pyproject.toml/uv.lock, здесь — бинарники.
[tools]
uv = "0.10.4"
hk = "2.10.0"
typos = "1.51.1"
betterleaks = "1.9.0"
ast-grep = "0.51.0"
osv-scanner = "2.7.0"
jactionlint = "2.4.0"
shellcheck = "0.11.0"  # jactionlint проверяет им шаги run:

[env]
# инструменты из uv.lock (ruff, pytest…) видны hk и задачам
_.path = ["{{config_root}}/.venv/bin"]

[tasks.check]
description = "Все проверки: то же самое запускает CI"
run = [
  "hk check --all",
  "betterleaks git --redact --no-banner .",  # секреты во всей истории git
  "deptry .",  # неиспользуемые и недостающие зависимости
  "ast-grep test --skip-snapshot-tests",  # сами правила ast-grep проверены своими тестами
  "uv run pytest -q",
]

[tasks.vulns]
description = "Известные уязвимости в uv.lock (нужна сеть; CI запускает и по расписанию)"
run = "osv-scanner scan source --lockfile uv.lock"

[tasks.fix]
description = "Безопасные автоисправления (ruff lint --fix и ruff format)"
run = "hk fix --all"
